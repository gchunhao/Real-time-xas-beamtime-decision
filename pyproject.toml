[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xas-beamtime-decision"
version = "0.2.1"
description = "Local, profile-driven real-time XAS beamtime decision framework"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Chunhao Gu" },
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "watchdog>=4.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/gchunhao/real-time-xas-beamtime-decision"
Issues = "https://github.com/gchunhao/real-time-xas-beamtime-decision/issues"

[project.scripts]
xas-beamtime = "xas_beamtime.cli:main"

[tool.setuptools.packages.find]
include = ["xas_beamtime*"]

[tool.setuptools.package-data]
xas_beamtime = ["profiles/**/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
