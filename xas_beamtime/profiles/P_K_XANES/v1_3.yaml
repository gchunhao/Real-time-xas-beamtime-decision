schema_version: 1
id: P_K_XANES_v1.3
version: "1.3"
status: freeze-candidate
identity:
  element: P
  edge: K
  scan_type: XANES
energy:
  edge_search_window_ev: [2147.5, 2152.9]
  minimum_points: 80
  interpolation_step_ev: 0.15
normalization:
  mode: selector
  # Used only as the rough preview baseline when automatic selector review is required.
  pre_edge_offsets_ev: [-10.0, -5.0]
  post_edge_offsets_ev: [27.0, 50.0]
  local_anchor_defaults_ev:
    pre: [-10.0, -5.0]
    post: [27.0, 50.0]
  selector:
    wide_pre_offsets_ev: [-20.0, -10.0]
    near_pre_offsets_ev: [-10.0, -5.0]
    pre_glitch_z_threshold: 6.0
    wide_limits:
      coverage_min: 0.90
      curvature_ratio_max: 3.8412089417049504
      extrapolation_stability_max: 0.04182719979481075
      glitch_count_max: 17
    near_limits:
      coverage_min: 0.90
      curvature_ratio_max: 4.649887722507669
      extrapolation_stability_max: 0.025571682495511068
      glitch_count_max: 5
    post_context:
      offsets_ev: [27.0, 50.0]
      norm_resid_max: 0.018
      stability_max: 0.27
    feature_context:
      offsets_ev: [5.0, 23.0]
      noise_norm_max: 0.0122
      a_spike_max: 6.1
    states:
      - WIDE_PRE
      - NEAR_PRE
      - HUMAN_LOCAL_REVIEW_REQUIRED
      - REVIEW_REQUIRED
    no_quality_promotion: true
    protected_anomaly_independent: true
    normalization_method: automatic_approximate
    normalization_precision: screening_level
    manual_review_recommended_for_critical_spectra: true
    publication_grade_normalization: false
quality:
  feature_offsets_ev: [5.0, 23.0]
  white_line_offsets_ev: [0.0, 5.0]
  savgol:
    width_points: 11
    polynomial_order: 3
  robust_mad_scale: 1.4826
  route_a:
    q_hf_max: 0.0045
  route_b:
    q_hf_max: 0.0070
    q_pre_max: 0.0055
    q_post_max: 0.0095
    a_spike_max: 3.0
  qualitative_guardrails:
    q_hf_max: 0.012
    a_spike_max: 6.0
  anomaly_detection:
    safe_zone_z_threshold: 6.0
    protected_zone_z_threshold: 4.5
    protected_regions:
      - {name: xanes_feature, offsets_ev: [0.0, 23.0]}
    # Held unchanged from v1.2 for the freeze-candidate replay lineage.
    safe_regions:
      - {name: local_pre, offsets_ev: [-10.0, -4.0]}
      - {name: post_edge, offsets_ev: [27.0, 50.0]}
averaging:
  initial_alpha: 0.50
  default_mode: equal
decision:
  precedence: [quantitative, qualitative, stop]
  quantitative_routes: [A, B]
  n_quant_rule: fastest_route
  normalization_review_states:
    - HUMAN_LOCAL_REVIEW_REQUIRED
    - REVIEW_REQUIRED
  suppress_route_and_prediction_during_normalization_review: true
  future_states:
    - quantitative_confirmed
references:
  interface_version: 1
  manifest_filename: references.yaml
  datasets_external: true
calibration:
  interface_version: 1
  optional_filename: beamline_calibration.yaml
  energy_order: raw_to_calibrated_to_e0
disclaimer:
  short: "Approximate automatic normalization — verify manually for critical spectra."
  review: "Automatic normalization is not sufficiently reliable for this spectrum. Expert review is required."
